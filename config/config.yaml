# stock-monitor configuration
# Copy this to config/secrets.yaml for actual keys (secrets.yaml is gitignored)

# ─── Upstox API ────────────────────────────────────────────────────────────────
upstox:
  api_key: "YOUR_UPSTOX_API_KEY"
  api_secret: "YOUR_UPSTOX_API_SECRET"
  redirect_uri: "http://localhost:8080/callback"
  # Token is auto-refreshed. Initial token must be generated manually once.
  # See docs/upstox_auth.md for setup steps.
  access_token: ""
  # Shared in-process pacing for market data calls. Historical candle history
  # is one instrument/request; 1 second keeps a full backfill under the 30-minute
  # standard API quota. Quotes are batched (max 500; default 100 for URL safety).
  historical_min_interval_seconds: 1.0
  quote_min_interval_seconds: 0.1
  request_max_retries: 3
  quote_batch_size: 100

# ─── Market Schedule ──────────────────────────────────────────────────────────
market:
  timezone: "Asia/Kolkata"
  open_time: "09:15"
  close_time: "15:30"
  # Scan interval in minutes (during market hours)
  scan_interval_minutes: 15
  # Days of the week to scan (0=Mon, 6=Sun)
  trading_days: [0, 1, 2, 3, 4]

# Coverage is measured against the configured selected stock universe.
scan:
  min_coverage: 0.95

# ─── Signal Configuration ─────────────────────────────────────────────────────
signals:
  rsi:
    enabled: true
    period: 14
    # mean_reversion keeps the former <=30 / >=70 rule. trend_momentum uses
    # the configured 55 / 45 RSI state thresholds and can be selected explicitly.
    mode: "mean_reversion"
    # level preserves the former behavior; cross_back waits for re-entry from
    # an extreme. Crossover confluence independently requires a fresh event.
    confirmation: "level"
    oversold_threshold: 30       # RSI below this → BUY signal
    overbought_threshold: 70     # RSI above this → SELL signal
    bullish_threshold: 55
    bearish_threshold: 45

  macd:
    enabled: true
    fast_period: 12
    slow_period: 26
    signal_period: 9

  ema_crossover:
    enabled: true
    # Pairs to monitor: [fast, slow]
    pairs:
      - [9, 21]
      - [21, 50]
      - [50, 200]

  volume_breakout:
    enabled: true
    # Volume must be N× the 20-day average to trigger
    volume_multiplier: 2.0
    # Price must break above N-day high
    breakout_lookback_days: 20

# ─── Signal Confluence ────────────────────────────────────────────────────────
confluence:
  # Minimum independent groups: trend (EMA family), momentum (RSI/MACD),
  # participation (volume). Same-group checks contribute at most one vote.
  min_groups_to_alert: 2
  # Require unanimous direction consensus (discards stocks with conflicting BUY vs SELL signals)
  direction_consensus: true
  # crossover uses fresh events; trend allows continuation from aligned EMA/MACD
  # states and RSI's configured bullish/bearish state thresholds. Volume breakout
  # remains event-based.
  mode: "crossover"

# ─── Stock Universe ──────────────────────────────────────────────────────────
universe:
  # Modes: all_nse (legacy/default), nifty500, custom, composed
  # composed = Nifty 500 + optional current F&O underlyings + custom symbols
  mode: "nifty500"
  # Required for custom/composed; symbols are validated against the local NSE instrument master.
  custom_symbols: []
  # Used only by composed. Unavailable F&O data is explicitly reported and never widens to all_nse.
  include_fno: false
  # Nifty 500 source guardrails; unusual source sizes fail validation and use last-known-good data.
  nifty500_min_count: 450
  nifty500_max_count: 550
  # For nifty500/custom/composed, default is EQ only. Set explicitly to opt into other NSE share series.
  # Leave unset for all_nse to preserve its legacy series coverage.
  # allowed_series: [EQ]
  # Minimum market cap filter (in Crores). 0 = no filter.
  min_mcap_cr: 0
  # Exclude penny stocks below this price (INR)
  min_price: 10
  # Liquidity screen uses finalized daily candles, not today's partial bar.
  tradability:
    enabled: true
    average_traded_value_sessions: 20
    minimum_average_traded_value_inr: 10000000  # ₹1 crore
    minimum_observations: 20
    unknown_policy: exclude

# ─── Benchmark and Sector Context ────────────────────────────────────────────
market_context:
  enabled: true
  mode: informational  # informational | filter (filter is opt-in)
  filter_unknown_policy: exclude  # when filter mode is enabled, missing required context suppresses that candidate
  benchmark_key: "NSE_INDEX|Nifty 50"
  lookback_sessions: 20
  short_sma_sessions: 20
  long_sma_sessions: 50
  cache_ttl_hours: 12
  # Explicit Screener sector label -> documented NSE index instrument key.
  sector_index_keys:
    "Banks - Private": "NSE_INDEX|Nifty Pvt Bank"
    "Banks - Public": "NSE_INDEX|Nifty PSU Bank"
    "Automobiles": "NSE_INDEX|Nifty Auto"
    "Information Technology": "NSE_INDEX|Nifty IT"
    "Pharmaceuticals": "NSE_INDEX|Nifty Pharma"
    "FMCG": "NSE_INDEX|Nifty FMCG"
    "Metals & Mining": "NSE_INDEX|Nifty Metal"
    "Oil, Gas & Fuels": "NSE_INDEX|NIFTY OIL AND GAS"
    "Financial Services": "NSE_INDEX|Nifty Fin Service"
    "Healthcare": "NSE_INDEX|NIFTY HEALTHCARE"

# ─── Optional Derivatives Context ────────────────────────────────────────────
derivatives:
  enabled: false  # opt in after validating eligible-underlying mapping and quotas
  cache_ttl_minutes: 15
  max_context_symbols_per_scan: 25

# ─── Risk references (no order execution) ─────────────────────────────────────
risk:
  enabled: true
  atr_period: 14
  stop_atr_multiple: 1.5
  target_r_multiple: 2.0
  account_capital_inr: null  # leave unset to omit quantity sizing
  risk_percent: 0.5

# ─── Offline backtest assumptions ────────────────────────────────────────────
backtest:
  atr_period: 14
  stop_atr_multiple: 1.5
  target_r_multiple: 2.0
  fee_bps_per_side: 5.0
  slippage_bps_per_side: 5.0
  train_fraction: 0.7

# ─── Fundamental Data ─────────────────────────────────────────────────────────
fundamentals:
  # Screener.in scraping (respects rate limits)
  screener_base_url: "https://www.screener.in"
  # Cache TTL in hours (fundamental data doesn't change frequently)
  cache_ttl_hours: 24
  # Rate limit delay between requests (seconds)
  request_delay_seconds: 2.0

# ─── Notifications ───────────────────────────────────────────────────────────
notifications:
  # Enable/disable individual notifiers
  telegram:
    enabled: true
    bot_token: "YOUR_TELEGRAM_BOT_TOKEN"
    # Recipient switches: Y sends to that destination; N disables it.
    individual_alert: "Y"
    chat_id: "YOUR_TELEGRAM_CHAT_ID"
    group_alert: "N"
    group_chat_id: ""
    # Send chart image with alert?
    send_chart: true

  discord:
    enabled: false
    webhook_url: "YOUR_DISCORD_WEBHOOK_URL"
    send_chart: true

  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    username: "YOUR_EMAIL@gmail.com"
    password: "YOUR_APP_PASSWORD"
    from_addr: "YOUR_EMAIL@gmail.com"
    to_addrs:
      - "YOUR_EMAIL@gmail.com"
    send_chart: false  # Email attachments are slow

  whatsapp:
    enabled: false
    # Uses Twilio WhatsApp sandbox
    account_sid: "YOUR_TWILIO_SID"
    auth_token: "YOUR_TWILIO_AUTH_TOKEN"
    from_number: "whatsapp:+14155238886"
    to_number: "whatsapp:+91XXXXXXXXXX"

# ─── Database ─────────────────────────────────────────────────────────────────
database:
  path: "data/stocks.db"

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  log_dir: "logs"
  # Rotate logs daily, keep 7 days
  backup_count: 7
